<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0614" />

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <title>CheriPic — Relationship Intelligence</title>
  <meta name="description"
    content="CheriPic is a freemium, verified dating platform built for people who are actually ready for a real relationship. Verified profiles. No endless swiping. Join freemium." />
  <link rel="canonical" href="https://cheripic.com/" />
  <meta name="robots" content="index, follow, max-image-preview:large" />

  <!-- Open Graph (Facebook, LinkedIn, Discord, WhatsApp, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CheriPic" />
  <meta property="og:url" content="https://cheripic.com/" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:title" content="CheriPic — Relationship Intelligence. Clarity Before Connection." />
  <meta property="og:description" content="Understand your patterns, explore intentional introductions and grow in love.
For singles and couples. Start free." />
  <meta property="og:image" content="https://cheripic.com/og-image.png" />
  <meta property="og:image:secure_url" content="https://cheripic.com/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="CheriPic — Relationship Intelligence. Clarity Before Connection." />

  <!-- X (Twitter) Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="CheriPic — Relationship Intelligence. Clarity Before Connection." />
  <meta name="twitter:description" content="Understand your patterns, explore intentional introductions and grow in love.
For singles and couples. Start free." />
  <meta name="twitter:image" content="https://cheripic.com/og-image.png" />
  <meta name="twitter:image:alt" content="CheriPic — Relationship Intelligence. Clarity Before Connection." />

  <!-- The video iframe only loads when the visitor clicks play, so YouTube's
         own origins just get a cheap DNS hint. i.ytimg.com gets a full
         preconnect because the thumbnail below is the mobile LCP element. -->
  <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
  <link rel="dns-prefetch" href="https://www.youtube.com" />
  <link rel="dns-prefetch" href="https://googlevideo.com" />

  <!-- The video thumbnail is the LCP element on mobile. Preload it so it
         downloads in parallel with the JS bundle instead of waiting for React
         to render the <img>. Keep the id in sync with the video in
         src/data/content.js (currently youtu.be/UAx4HDNpJE4). -->
  <link rel="preload" as="image" href="https://i.ytimg.com/vi/UAx4HDNpJE4/mqdefault.jpg" media="(max-width: 700px)"
    fetchpriority="high" />
  <link rel="preload" as="image" href="https://i.ytimg.com/vi/UAx4HDNpJE4/maxresdefault.jpg"
    media="(min-width: 701px)" />

  <!-- Fonts load with display=optional (non-blocking), so a DNS hint for the
         stylesheet host is enough; only the font-file origin gets a preconnect.
         Keeps the total preconnect count low, as Lighthouse recommends. -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Preload the app entry so it downloads alongside the HTML parse. -->
  <link rel="modulepreload" href="/src/main.jsx" />

  <!-- Load fonts without blocking render: fetch as a stylesheet, then swap
         it in on load. font-display:optional means the browser gives the font a
         brief window, then commits to the fallback for the rest of that load
         (no swap-in reflow) — the font is cached for the next visit. This keeps
         layout shift (CLS) out of the hero headline on cold loads. -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=optional"
    onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=optional" />
  </noscript>

  <!-- Paint the brand ground before the bundle lands, so there's no white flash. -->
  <style>
    body {
      margin: 0;
      background: #0a0614;
    }

    #root {
      min-height: 100vh;
    }
  </style>

  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "CheriPic",
        "url": "https://cheripic.com/",
        "logo": "https://cheripic.com/apple-touch-icon.png",
        "description": "Understand your patterns, explore intentional introductions and grow in love. For singles and couples. Start free.",
        "parentOrganization": {
          "@type": "Organization",
          "name": "Cave Xpert Inc."
        }
      }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
